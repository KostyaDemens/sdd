spring:
  application:
    name: sdd
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vets}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      # Use `validate` in managed environments once migrations own the schema.
      ddl-auto: ${JPA_DDL_AUTO:update}
